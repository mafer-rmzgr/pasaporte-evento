<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasaporte del Evento</title>
    <!-- Librería para la celebración digital con confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #333; font-size: 1.8rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        
        .grid-pasaporte {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .sello {
            background-color: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px; 
            transition: all 0.3s ease;
        }

        .sello img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            transition: all 0.4s ease;
        }

        .bloqueado {
            border: 2px dashed #d1d1d1;
            background-color: #fafafa;
        }
        .bloqueado img {
            filter: grayscale(100%) opacity(20%);
        }

        .desbloqueado {
            border: 2px solid #4CAF50;
            background-color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.2);
        }
        .desbloqueado img {
            filter: grayscale(0%) opacity(100%);
        }

        /* Animación para el cartel de premio */
        @keyframes popIn { 
            0% { transform: scale(0.5); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>

    <h1>Pasaporte Interactivo</h1>
    <p>Escanea el QR en cada stand para activar su logo.</p>

    <div class="grid-pasaporte">
        <!-- Imágenes y stands -->
        <div id="stand-abb" class="sello bloqueado"><img src="img/abb.png" alt="ABB"></div>
        <div id="stand-aspentech" class="sello bloqueado"><img src="img/aspentech.png" alt="AspenTech"></div>
        <div id="stand-dow" class="sello bloqueado"><img src="img/dow.png" alt="Dow"></div>
        <div id="stand-emerson" class="sello bloqueado"><img src="img/emerson.png" alt="Emerson"></div>
        <div id="stand-engie" class="sello bloqueado"><img src="img/engie.png" alt="Engie"></div>
        <div id="stand-goodway" class="sello bloqueado"><img src="img/Goodway.png" alt="Goodway"></div>
        <div id="stand-halliburton" class="sello bloqueado"><img src="img/Halliburton.png" alt="Halliburton"></div>
        <div id="stand-linde" class="sello bloqueado"><img src="img/linde.png" alt="Linde"></div>
        <div id="stand-pemex" class="sello bloqueado"><img src="img/pemex.png" alt="Pemex"></div>
        <div id="stand-woodside" class="sello bloqueado"><img src="img/woodside.png" alt="Woodside"></div>
        <div id="stand-orbia" class="sello bloqueado"><img src="img/orbia.png" alt="Orbia"></div>
    </div>

    <!-- Mensaje de Pasa por tu premio, oculto por defecto -->
    <div id="mensaje-premio" style="display: none; margin-top: 30px; padding: 20px; background-color: #4CAF50; color: white; border-radius: 12px; animation: popIn 0.5s ease;">
        <h2>¡Pasaporte Lleno! 🎉</h2>
        <p style="color: white; font-size: 1.2rem; font-weight: bold;">Pasa por tu premio</p>
    </div>

    <!-- Botón discreto para reiniciar pasaporte en pruebas -->
    <div style="margin-top: 40px;">
        <button onclick="reiniciarPasaporte()" style="background: none; border: none; color: #d1d1d1; font-size: 0.8rem; cursor: pointer; text-decoration: underline;">
            Reiniciar pasaporte
        </button>
    </div>

    <script>
        const empresas = [
            'abb', 'aspentech', 'dow', 'emerson', 'engie', 
            'goodway', 'halliburton', 'linde', 'pemex', 'woodside', 'orbia'
        ];

        const parametrosURL = new URLSearchParams(window.location.search);
        const selloEscaneado = parametrosURL.get('sello');

        // 1. Guardar sello en LocalStorage si existe en la URL
        if (selloEscaneado && empresas.includes(selloEscaneado)) {
            localStorage.setItem(selloEscaneado, 'visitado');
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // 2. Revisar cuántos stands están visitados
        let sellosCompletados = 0;

        empresas.forEach(empresa => {
            const estadoSello = localStorage.getItem(empresa);
            if (estadoSello === 'visitado') {
                const elemento = document.getElementById(`stand-${empresa}`);
                if (elemento) {
                    elemento.classList.remove('bloqueado');
                    elemento.classList.add('desbloqueado');
                    sellosCompletados++;
                }
            }
        });

        // 3. Activar celebración digital y mostrar mensaje de premio
        if (sellosCompletados === empresas.length) {
            document.getElementById('mensaje-premio').style.display = 'block';
            
            // Disparar animación de confeti
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // 4. Función para resetear los datos del navegador
        function reiniciarPasaporte() {
            if(confirm("¿Seguro que quieres borrar todos los sellos?")) {
                localStorage.clear();
                window.location.href = window.location.pathname;
            }
        }
    </script>
</body>
</html>
