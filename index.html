<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E1C6E">
<title>Pasaporte Petrolero · XXXI Semana de Ingeniería Química Petrolera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --azul: #1B2FA8;
    --azul-osc: #0B1560;
    --azul-tarjeta: rgba(8, 16, 90, .55);
    --amarillo: #FFD21F;
    --blanco: #ffffff;
    --texto-suave: #b9c3f5;
    --linea: rgba(255,255,255,.18);
    --ok: #3ddc84;
    --d-lunes: #4FA3B8;
    --d-martes: #F28C3A;
    --d-miercoles: #D96AA7;
    --d-jueves: #7A5BB5;
    --color-dia: var(--d-lunes);
    --titulo: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
    --cuerpo: 'Barlow', 'Segoe UI', Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--blanco);
    font-family: var(--cuerpo);
    background-color: var(--azul-osc);
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(170deg, var(--azul) 0%, var(--azul-osc) 70%);
    background-size: 28px 28px, 28px 28px, 100% 100%;
    background-attachment: fixed;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 18px 16px 70px; }

  /* ---------- Cabecera ---------- */
  .cabecera { text-align: center; }
  .logos { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .insignia {
    width: 64px; height: 64px; background: var(--blanco); border-radius: 16px;
    display: flex; align-items: center; justify-content: center; padding: 6px; flex: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .insignia img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .evento { font-size: .82rem; line-height: 1.25; color: var(--texto-suave); font-weight: 500; }
  .evento b { color: var(--blanco); font-weight: 600; display: block; font-size: .9rem; }
  h1 {
    margin: 18px 0 4px; font-family: var(--titulo); font-weight: 800;
    font-size: clamp(3rem, 15vw, 4.2rem); line-height: .88; letter-spacing: .5px; text-transform: uppercase;
  }
  h1 span { display: block; color: var(--amarillo); }
  .fechas {
    display: inline-block; margin-top: 12px; padding: 6px 16px; border: 1.5px solid var(--amarillo);
    border-radius: 99px; color: var(--amarillo); font-size: .85rem; font-weight: 600;
  }

  /* ---------- Login ---------- */
  #login {
    margin-top: 26px; padding: 26px 20px; text-align: center;
    background: var(--azul-tarjeta); border: 1px solid var(--linea); border-radius: 18px;
    backdrop-filter: blur(6px);
  }
  #login h2 { font-family: var(--titulo); font-weight: 700; font-size: 1.7rem; margin: 0 0 6px; }
  #login p { margin: 0 0 18px; color: var(--texto-suave); font-size: .95rem; line-height: 1.4; }
  .btn-google {
    display: inline-flex; align-items: center; gap: 10px; background: var(--blanco); color: #1d2433;
    border: none; padding: 13px 22px; border-radius: 12px; font: 600 1rem var(--cuerpo); cursor: pointer;
  }
  .btn-google svg { width: 20px; height: 20px; }
  #error { color: #ffb4a8; font-size: .88rem; margin-top: 12px; min-height: 1em; }

  /* ---------- Usuario ---------- */
  #usuario {
    display: none; align-items: center; gap: 10px; margin-top: 20px; padding: 8px 12px;
    background: var(--azul-tarjeta); border: 1px solid var(--linea); border-radius: 14px; font-size: .88rem;
  }
  #usuario img { width: 32px; height: 32px; border-radius: 50%; background: var(--blanco); flex: none; }
  #usuario .quien { flex: 1; min-width: 0; line-height: 1.2; }
  #usuario .quien b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #usuario .quien small { color: var(--texto-suave); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #btn-salir { background: none; border: none; color: var(--amarillo); font: 600 .82rem var(--cuerpo); cursor: pointer; text-decoration: underline; }

  /* ---------- Días ---------- */
  #pasaporte { display: none; margin-top: 16px; }
  .dias { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .dia {
    --c: var(--d-lunes);
    background: rgba(255,255,255,.07); border: 2px solid var(--c); color: var(--blanco);
    border-radius: 14px; padding: 9px 2px 8px; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; line-height: 1.1;
    font-family: var(--titulo); font-weight: 700; font-size: 1.05rem;
  }
  .dia .num { font-size: 1.7rem; font-weight: 800; }
  .dia small { font: 500 .72rem var(--cuerpo); opacity: .85; margin-top: 2px; }
  .dia[aria-selected="true"] { background: var(--c); color: #101a4d; }
  .dia.completo small::after { content: " ✓"; }

  /* ---------- Medidor ---------- */
  .medidor { margin: 18px 0 6px; }
  .medidor-fila { display: flex; align-items: baseline; justify-content: space-between; }
  .medidor-fila .nombre { font-family: var(--titulo); font-weight: 700; font-size: 1.25rem; }
  .medidor-fila .cuenta { font-family: var(--titulo); font-weight: 800; font-size: 2.2rem; color: var(--amarillo); line-height: 1; }
  .cuenta small { font-size: 1.1rem; color: var(--texto-suave); font-weight: 600; }
  .tanque {
    position: relative; height: 14px; border-radius: 99px; background: rgba(0,0,0,.35);
    border: 1.5px solid var(--linea); overflow: hidden; margin-top: 8px;
  }
  .tanque .nivel { height: 100%; width: 0; background: var(--amarillo); border-radius: 99px; transition: width .6s ease; }
  .tanque .marcas {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1.5px), rgba(11,21,96,.7) calc(10% - 1.5px) 10%);
  }

  /* ---------- Tarjetas de stands ---------- */
  .lista { display: grid; gap: 10px; margin-top: 16px; padding: 0; list-style: none; }
  .stand {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px;
    background: var(--azul-tarjeta); border: 1.5px dashed var(--linea);
    transition: border-color .3s ease, background .3s ease;
  }
  .stand .logo {
    width: 54px; height: 54px; flex: none; background: var(--blanco); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; padding: 5px; overflow: hidden;
    font: 800 1.1rem var(--titulo); color: var(--azul);
  }
  .stand .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .stand .datos { flex: 1; min-width: 0; }
  .stand .datos b { display: block; font-size: 1.02rem; font-weight: 600; }
  .stand .estado {
    display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 99px;
    font-size: .74rem; font-weight: 600; border: 1.2px solid var(--linea); color: var(--texto-suave);
  }
  .stand.pendiente .logo { filter: grayscale(1); opacity: .45; }
  .stand.sellado { border: 1.5px solid var(--amarillo); background: rgba(255, 210, 31, .1); }
  .stand.sellado .estado { background: var(--amarillo); border-color: var(--amarillo); color: #101a4d; }
  .stand.sellado .logo { animation: sello .55s cubic-bezier(.2,1.6,.4,1); }
  .stand .check { font-size: 1.4rem; color: var(--amarillo); flex: none; }
  @keyframes sello { 0% { transform: scale(1.7) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

  /* ---------- Premio ---------- */
  #premio {
    display: none; margin-top: 22px; padding: 22px 16px; text-align: center; border-radius: 20px;
    background: var(--amarillo); color: #101a4d; animation: sello .6s ease;
  }
  #premio .xxxi { font-family: var(--titulo); font-weight: 800; font-size: 3rem; line-height: .9; }
  #premio h2 { margin: 6px 0 2px; font-family: var(--titulo); font-weight: 800; font-size: 1.8rem; text-transform: uppercase; }
  #premio p { margin: 0; font-weight: 600; font-size: 1.05rem; }

  /* ---------- Pantalla de sello conseguido ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 35%, var(--azul) 0%, var(--azul-osc) 75%);
  }
  #overlay.visible { display: flex; }
  #overlay .logo-grande {
    width: 150px; height: 150px; background: var(--blanco); border-radius: 28px; padding: 14px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
    font: 800 3rem var(--titulo); color: var(--azul); animation: sello .6s cubic-bezier(.2,1.6,.4,1);
    box-shadow: 0 0 0 6px var(--amarillo), 0 10px 40px rgba(0,0,0,.4);
  }
  #overlay .logo-grande img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #overlay h2 { font-family: var(--titulo); font-weight: 800; font-size: 2.6rem; color: var(--amarillo); margin: 0; text-transform: uppercase; line-height: 1; }
  #overlay p { margin: 8px 0 24px; font-size: 1.1rem; }
  #overlay button {
    background: var(--amarillo); color: #101a4d; border: none; border-radius: 12px;
    padding: 13px 28px; font: 700 1rem var(--cuerpo); cursor: pointer;
  }

  /* ---------- Aviso ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140px); z-index: 30;
    background: var(--blanco); color: #101a4d; padding: 12px 18px; border-radius: 12px;
    font-size: .92rem; font-weight: 600; max-width: 90%; text-align: center; transition: transform .35s ease;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  #toast.visible { transform: translate(-50%, 0); }

  :focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <header class="cabecera">
    <div class="logos">
      <div class="insignia"><img src="img/esiqie.png" alt="ESIQIE"></div>
      <div class="evento"><b>XXXI Semana de Ingeniería Química Petrolera</b>ESIQIE-IPN</div>
      <div class="insignia"><img src="img/ipn.png" alt="IPN"></div>
    </div>
    <h1>Pasaporte <span>Petrolero</span></h1>
    <div class="fechas">23 al 27 de noviembre de 2026</div>
  </header>

  <!-- Login -->
  <section id="login">
    <h2>Inicia sesión para sellar tu pasaporte</h2>
    <p>Usa tu cuenta de Gmail. Cada stand que visites suma un sello.</p>
    <button id="btn-login" class="btn-google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <div id="error" role="alert"></div>
  </section>

  <!-- Usuario -->
  <div id="usuario">
    <img id="foto" alt="" referrerpolicy="no-referrer">
    <div class="quien"><b id="nombre"></b><small id="correo"></small></div>
    <button id="btn-salir">Cerrar sesión</button>
  </div>

  <!-- Pasaporte -->
  <section id="pasaporte">
    <div class="dias" role="tablist" id="dias"></div>

    <div class="medidor">
      <div class="medidor-fila">
        <span class="nombre" id="medidor-nombre"></span>
        <span class="cuenta" id="medidor-cuenta"></span>
      </div>
      <div class="tanque"><div class="nivel" id="nivel"></div><div class="marcas"></div></div>
    </div>

    <ul class="lista" id="lista"></ul>

    <div id="premio">
      <div class="xxxi">XXXI</div>
      <h2>¡Día completo!</h2>
      <p>Pasa por tu premio</p>
    </div>
  </section>
</div>

<!-- Sello conseguido -->
<div id="overlay" role="dialog" aria-live="polite">
  <div class="logo-grande" id="overlay-logo"></div>
  <h2>¡Sello conseguido!</h2>
  <p id="overlay-texto"></p>
  <button id="overlay-cerrar">Ver mi pasaporte</button>
</div>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js";

/* ================= CONFIGURACIÓN ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDrivDNeM2xa8y5ixZHvYRw8tpoHuyQty8",
  authDomain: "pasaporte-evento.firebaseapp.com",
  projectId: "pasaporte-evento",
  storageBucket: "pasaporte-evento.firebasestorage.app",
  messagingSenderId: "827723147076",
  appId: "1:827723147076:web:2edd3465393ec53fd51911"
};

const SOLO_GMAIL = false;   // true = solo correos @gmail.com

// id = lo que va en el QR (?sello=...). Los logos van en la carpeta img/.
const STANDS = {
  linde:       { nombre: "Linde",       img: "img/linde.png" },
  koehler:     { nombre: "Koehler",     img: "img/koehler.png" },
  abb:         { nombre: "ABB",         img: "img/abb.png" },
  emerson:     { nombre: "Emerson",     img: "img/emerson.png" },
  sica:        { nombre: "SICA",        img: "img/sica.png" },
  g2h:         { nombre: "G2H",         img: "img/g2h.png" },
  spe:         { nombre: "SPE",         img: "img/spe.png" },
  secovam:     { nombre: "Secovam",     img: "img/secovam.png" },
  adriannava:  { nombre: "Adrian Nava", img: "img/adriannava.png" },
  probecarios: { nombre: "Probecarios", img: "img/probecarios.png" },
  dow:         { nombre: "Dow",         img: "img/dow.png" },
  cryoinfra:   { nombre: "Cryoinfra",   img: "img/cryoinfra.png" },
  goodway:     { nombre: "GoodWay",     img: "img/Goodway.png" },
  ampp:        { nombre: "AMPP",        img: "img/ampp.png" },
  clayton:     { nombre: "Clayton",     img: "img/clayton.png" },
  arkema:      { nombre: "Arkema",      img: "img/arkema.png" },
  lukoil:      { nombre: "Lukoil",      img: "img/lukoil.png" }
};

const DIAS = {
  lunes:     { etiqueta: "Lunes",     corto: "Lun", fecha: "23", color: "var(--d-lunes)",
               stands: ["linde","koehler","abb","emerson","sica","g2h","spe","secovam","adriannava","probecarios"] },
  martes:    { etiqueta: "Martes",    corto: "Mar", fecha: "24", color: "var(--d-martes)",
               stands: ["linde","koehler","dow","emerson","cryoinfra","g2h","sica","secovam","adriannava","probecarios"] },
  miercoles: { etiqueta: "Miércoles", corto: "Mié", fecha: "25", color: "var(--d-miercoles)",
               stands: ["cryoinfra","koehler","dow","emerson","goodway","g2h","sica","secovam","adriannava"] },
  jueves:    { etiqueta: "Jueves",    corto: "Jue", fecha: "26", color: "var(--d-jueves)",
               stands: ["ampp","spe","clayton","arkema","lukoil","g2h","sica","secovam","adriannava"] }
};
/* ================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

const $ = id => document.getElementById(id);
let uid = null, sellos = {}, diaActual = null;

function diaDeHoy() {
  const n = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"][new Date().getDay()];
  return DIAS[n] ? n : "lunes";
}

/* ---------- Sesión ---------- */
$("btn-login").addEventListener("click", async () => {
  $("error").textContent = "";
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      signInWithRedirect(auth, provider);
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      $("error").textContent = "No se pudo iniciar sesión. Abre esta página en Chrome o Safari e inténtalo de nuevo.";
      console.error(e);
    }
  }
});
$("btn-salir").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (user && SOLO_GMAIL && !user.email.toLowerCase().endsWith("@gmail.com")) {
    await signOut(auth);
    $("error").textContent = "Usa una cuenta de Gmail para participar.";
    return;
  }
  if (!user) {
    uid = null; sellos = {};
    $("login").style.display = "block";
    $("usuario").style.display = "none";
    $("pasaporte").style.display = "none";
    return;
  }
  uid = user.uid;
  $("login").style.display = "none";
  $("usuario").style.display = "flex";
  $("pasaporte").style.display = "block";
  $("nombre").textContent = "Hola, " + ((user.displayName || user.email).split(" ")[0]);
  $("correo").textContent = user.email;
  if (user.photoURL) $("foto").src = user.photoURL; else $("foto").style.display = "none";

  const qr = leerQR();
  diaActual = (qr && DIAS[qr.dia]) ? qr.dia : (diaActual || diaDeHoy());
  await cargarSellos();
  const nuevo = qr ? await registrarSello(qr.dia, qr.sello) : null;
  pintarDias();
  pintarDia(!nuevo);
  if (nuevo) mostrarOverlay(nuevo);
});

/* ---------- QR: ?dia=lunes&sello=linde ---------- */
function leerQR() {
  const p = new URLSearchParams(window.location.search);
  const sello = (p.get("sello") || "").toLowerCase();
  if (!sello) return null;
  return { dia: (p.get("dia") || diaDeHoy()).toLowerCase(), sello };
}

async function registrarSello(dia, sello) {
  window.history.replaceState({}, document.title, window.location.pathname);
  if (!DIAS[dia] || !DIAS[dia].stands.includes(sello)) { aviso("Este QR no corresponde a un stand de ese día."); return null; }
  if (sellos[dia]?.[sello]) { aviso(`Ya tenías el sello de ${STANDS[sello].nombre}.`); return null; }
  try {
    await setDoc(doc(db, "usuarios", uid), {
      email: auth.currentUser.email,
      nombre: auth.currentUser.displayName || "",
      sellos: { [dia]: { [sello]: true } }
    }, { merge: true });
    sellos[dia] = { ...(sellos[dia] || {}), [sello]: true };
    return sello;
  } catch (e) {
    console.error(e);
    aviso("No se pudo guardar el sello. Revisa tu conexión e inténtalo otra vez.");
    return null;
  }
}

async function cargarSellos() {
  try {
    const snap = await getDoc(doc(db, "usuarios", uid));
    sellos = snap.exists() ? (snap.data().sellos || {}) : {};
  } catch (e) { console.error(e); sellos = {}; }
}

/* ---------- Interfaz ---------- */
function conteo(dia) {
  const l = DIAS[dia].stands;
  return { hechos: l.filter(s => sellos[dia]?.[s]).length, total: l.length };
}

function logoEn(contenedor, stand) {
  contenedor.textContent = "";
  const img = document.createElement("img");
  img.src = stand.img; img.alt = stand.nombre;
  img.onerror = () => { contenedor.textContent = stand.nombre.slice(0, 2).toUpperCase(); };
  contenedor.appendChild(img);
}

function pintarDias() {
  const cont = $("dias");
  cont.innerHTML = "";
  for (const [clave, d] of Object.entries(DIAS)) {
    const { hechos, total } = conteo(clave);
    const b = document.createElement("button");
    b.className = "dia" + (hechos === total ? " completo" : "");
    b.style.setProperty("--c", d.color);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", clave === diaActual);
    b.innerHTML = `${d.corto}<span class="num">${d.fecha}</span><small>${hechos}/${total}</small>`;
    b.addEventListener("click", () => { diaActual = clave; pintarDias(); pintarDia(false); });
    cont.appendChild(b);
  }
}

function pintarDia(celebrar) {
  const d = DIAS[diaActual];
  const { hechos, total } = conteo(diaActual);

  $("medidor-nombre").textContent = `${d.etiqueta} ${d.fecha} de noviembre`;
  $("medidor-cuenta").innerHTML = `${hechos}<small> / ${total}</small>`;
  $("nivel").style.width = (hechos / total * 100) + "%";

  const lista = $("lista");
  lista.innerHTML = "";
  for (const id of d.stands) {
    const s = STANDS[id], listo = !!sellos[diaActual]?.[id];
    const li = document.createElement("li");
    li.className = "stand " + (listo ? "sellado" : "pendiente");
    const logo = document.createElement("div"); logo.className = "logo"; logoEn(logo, s);
    const datos = document.createElement("div"); datos.className = "datos";
    datos.innerHTML = `<b></b><span class="estado">${listo ? "Sellado" : "Pendiente"}</span>`;
    datos.querySelector("b").textContent = s.nombre;
    li.append(logo, datos);
    if (listo) { const c = document.createElement("span"); c.className = "check"; c.textContent = "✓"; li.appendChild(c); }
    lista.appendChild(li);
  }

  const completo = hechos === total;
  $("premio").style.display = completo ? "block" : "none";
  if (completo && celebrar) confeti();
}

function mostrarOverlay(id) {
  const s = STANDS[id];
  logoEn($("overlay-logo"), s);
  $("overlay-texto").textContent = `Visitaste el stand de ${s.nombre}.`;
  $("overlay").classList.add("visible");
  if (navigator.vibrate) navigator.vibrate([80, 60, 120]);
}
$("overlay-cerrar").addEventListener("click", () => {
  $("overlay").classList.remove("visible");
  pintarDia(true);
});

function confeti() {
  const fin = Date.now() + 3000;
  const base = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 50, colors: ["#FFD21F", "#1B2FA8", "#ffffff"] };
  const t = setInterval(() => {
    const resta = fin - Date.now();
    if (resta <= 0) return clearInterval(t);
    confetti({ ...base, particleCount: 50 * (resta / 3000), origin: { x: Math.random(), y: Math.random() - 0.2 } });
  }, 250);
}

let temporizador;
function aviso(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("visible");
  clearTimeout(temporizador);
  temporizador = setTimeout(() => t.classList.remove("visible"), 3500);
}
</script>
</body>
