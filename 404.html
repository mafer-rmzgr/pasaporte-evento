<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo al Pasaporte...</title>
  <script>
    const path = window.location.pathname;
    const cleanPath = path.replace(/^\/pasaporte-evento\/?/, '').replace(/\/$/, '');
    const parts = cleanPath.split('/');

    if (parts.length >= 2) {
      const dia = parts[0].toLowerCase();
      const sello = parts[1].toLowerCase();
      // Aquí cambiamos "empresa" por "sello" para que coincida con tu index.html
      window.location.replace(`/pasaporte-evento/?dia=${encodeURIComponent(dia)}&sello=${encodeURIComponent(sello)}`);
    } else {
      window.location.replace('/pasaporte-evento/');
    }
  </script>
</head>
<body>
  <p>Cargando sello del pasaporte...</p>
</body>
</html>
