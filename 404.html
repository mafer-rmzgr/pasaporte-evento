<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo al Pasaporte...</title>
  <script>
    const cleanPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
    const parts = cleanPath.split('/');

    if (parts.length >= 2 && parts[0] && parts[1]) {
      const dia = parts[0].toLowerCase();
      const sello = parts[1].toLowerCase();
      window.location.replace(`/?dia=${encodeURIComponent(dia)}&sello=${encodeURIComponent(sello)}`);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Cargando sello del pasaporte...</p>
</body>
</html>
